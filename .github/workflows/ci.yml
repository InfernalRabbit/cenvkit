name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.11"
  # Docker Compose used by the docker acceptance gate — PINNED, not "latest".
  # Bump COMPOSE_VERSION and COMPOSE_SHA256_LINUX_X86_64 together, in a dedicated
  # commit, only after the acceptance suite passes against the new release.
  COMPOSE_VERSION: "v5.8.0"
  COMPOSE_SHA256_LINUX_X86_64: "b8840f5008c447f41fce0a57ae3adeab42c89b1eb6e6012524bcabbfb4ffbaf6"

# Supersede in-flight runs for the same ref (branch push / PR); a tag push has
# its own push ref, so CI for a tag is never cancelled by branch activity.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: vet / gofmt / golangci-lint / seam
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt (fail if any file is unformatted)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: compose-go seam check (only internal/engine may import compose-go)
        run: |
          MOD=$(go list -m)
          # Strip the engine package's OWN line first (anchored ImportPath +
          # trailing space), THEN look for any remaining compose-go import. An
          # unanchored `grep -v .../internal/engine` would wrongly exclude any
          # package that merely IMPORTS internal/engine (e.g. cmd) and thus miss
          # a real leak there.
          leaks=$(go list -f '{{.ImportPath}} {{join .Imports " "}}' ./... \
            | grep -v "^${MOD}/internal/engine " \
            | grep 'compose-spec/compose-go' || true)
          if [ -n "$leaks" ]; then
            echo "compose-go leaked outside internal/engine:"
            echo "$leaks"
            exit 1
          fi
          echo "seam OK"

      - name: shell scripts (sh -n + installer self-test)
        # The shipped shell is POSIX sh: the tracked launcher plus scripts/ci/*.
        # The self-test builds a release-shaped archive, serves it over a
        # file:// mirror and asserts the pinned installer accepts a matching
        # sha256 and refuses a tampered one — no network involved.
        run: |
          for f in cenvkit scripts/ci/*.sh; do
            sh -n "$f"
          done
          sh scripts/ci/cenvkit-install-selftest.sh

      - name: golangci-lint
        # Install via `go install` so the linter is built with THIS job's Go
        # (1.26). The golangci-lint-action ships a prebuilt binary built with an
        # older Go that refuses to run against a newer go.mod target ("the Go
        # language version used to build golangci-lint is lower than the targeted
        # Go version"). Pinned for reproducibility (matches local).
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  goreleaser-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  release-snapshot:
    name: goreleaser snapshot (all targets build pre-tag)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog needs the full history + tags
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Cut the actual release pipeline BEFORE the tag exists: builds every
      # goos/goarch (linux/darwin/windows x amd64/arm64), assembles the archives
      # (with their LICENSE/README/CHANGELOG/NOTICES files), checksums and the
      # changelog — then stops without publishing. `goreleaser build` takes no
      # `--skip=publish` flag in v2 (it never publishes), so a snapshot
      # `release` is the supported dry run and also exercises the archive config.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

  test:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build ./...
      - name: go test
        # The unit job is docker-free on purpose (it runs on macOS too, which has
        # no docker daemon); the acceptance-docker job covers the docker path.
        # `./...` also includes ./test, so this step IS the no-docker acceptance
        # run (docker-gated assertions skip themselves) — the coverage the former
        # standalone `acceptance-no-docker` job provided.
        # -count=1 disables the go test result cache: `cache: true` restores
        # GOCACHE/GOMODCACHE across runs, and a cached "ok" must never stand in
        # for actually executing the suite.
        env:
          SMOKE_SKIP_DOCKER: "1"
        run: go test ./... -count=1

  acceptance-docker:
    name: acceptance (docker, pinned compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Pinned on purpose (two reasons):
      #   * reproducibility — a "releases/latest" URL makes the gate depend on
      #     whatever Compose shipped that day, so a green run stops meaning
      #     anything about a specific Compose version;
      #   * supply chain — the binary is fetched from the network and executed
      #     under the runner; the sha256 below must match before it is installed.
      # Bump deliberately: change the version + checksum in the env block above,
      # in one commit, after checking the new release notes and a local run.
      # Drift against the newest upstream release is still observed — but
      # non-blocking — by the `compose-latest` job below.
      - name: Install pinned Docker Compose (${{ env.COMPOSE_VERSION }} + sha256)
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::The pinned checksum covers docker-compose-linux-x86_64 only; add an arm64 pin before moving this job to $(uname -m) runners."
            exit 1
          fi
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
            -o /tmp/docker-compose
          echo "${COMPOSE_SHA256_LINUX_X86_64}  /tmp/docker-compose" | sha256sum -c -
          chmod +x /tmp/docker-compose
          mv /tmp/docker-compose ~/.docker/cli-plugins/docker-compose
      - name: docker compose version matches the pin
        run: |
          docker compose version
          got="$(docker compose version --short)"
          got="${got#v}"
          if [ "$got" != "${COMPOSE_VERSION#v}" ]; then
            echo "::error::Installed Docker Compose is $got, expected ${COMPOSE_VERSION#v} — update COMPOSE_SHA256_* with COMPOSE_VERSION."
            exit 1
          fi
      - name: acceptance suite (docker)
        run: go test ./test/... -v -count=1

  # Kept as a NON-BLOCKING drift detector: the pinned gate above decides whether
  # a change is good; this job only reports when upstream Docker Compose has moved
  # on. It intentionally downloads `latest` without a checksum (a pin here would
  # defeat the purpose) and must never fail the workflow — hence
  # continue-on-error, which is why it is a separate job rather than a step.
  compose-latest:
    name: acceptance vs latest Docker Compose (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install latest Docker Compose (drift signal, unverified by design)
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
      - name: docker compose version (upstream latest)
        run: docker compose version
      - name: acceptance suite (docker) against latest Compose
        id: latest-acceptance
        # Capture the status instead of aborting, so the summary below always runs.
        run: |
          set +e
          go test ./test/... -count=1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: drift summary
        # This job is advisory (continue-on-error), and an invisible advisory is
        # noise: publish the pinned-vs-latest comparison into the run summary and
        # raise an annotation when upstream has moved on.
        if: always()
        run: |
          latest="$(docker compose version --short 2>/dev/null || echo unknown)"
          {
            echo "### Docker Compose drift"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| pinned in CI | `${{ env.COMPOSE_VERSION }}` |"
            echo "| upstream latest | `$latest` |"
            echo "| acceptance vs latest | `${{ steps.latest-acceptance.outputs.exit_code }}` (0 = no drift detected) |"
          } >> "$GITHUB_STEP_SUMMARY"
          code="${{ steps.latest-acceptance.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::warning title=Docker Compose drift::acceptance fails against upstream latest; the pinned gate still decides. See the acceptance log."
          fi
