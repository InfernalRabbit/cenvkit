# GoReleaser config for cenvkit — per-OS binaries built from ./cmd/cenvkit.
# No committed binaries; releases are produced on a Git tag in CI.
# Validate locally with `goreleaser check`.
version: 2

project_name: cenvkit

before:
  hooks:
    - go mod tidy

builds:
  - id: cenvkit
    main: ./cmd/cenvkit
    binary: cenvkit
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: cenvkit
    formats: [tar.gz]
    # Use zip for Windows archives.
    format_overrides:
      - goos: windows
        formats: [zip]
    # Ship the project's own legal/notice files inside every archive (tar.gz and
    # the Windows zip): the MIT LICENSE plus THIRD_PARTY_NOTICES.md, which
    # carries the Apache-2.0 §4(d) NOTICE texts of the linked dependencies.
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # Newest first in the release notes.
  sort: desc
  filters:
    # Drop non-user-facing conventional commits. The optional scope group
    # matches the scoped spelling too (`chore(release):`, `docs(readme):`,
    # `ci(github):`, ...), which plain `^chore:` used to let through.
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
